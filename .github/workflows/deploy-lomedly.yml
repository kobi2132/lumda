# Copies the site to Jacob's server, where Caddy serves it at https://lomedly.jacob-apps.co.il
# The files go as they are (no build). The SSH key in the secret can only write into /srv/sites/lomedly
# (rrsync in the server's authorized_keys), so it can't run anything else on the server.
name: Deploy to lomedly.jacob-apps.co.il

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-lomedly
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HOST: 65.109.12.170
      # the server's public SSH host key (not a secret), so the copy only goes to this server
      HOST_KEY: ""
    steps:
      - name: Check the deploy key is set
        id: ready
        env:
          KEY: ${{ secrets.LOMEDLY_SSH_KEY }}
        run: |
          if [ -z "$KEY" ] || [ -z "$HOST_KEY" ]; then
            echo "::notice::The server isn't connected yet (no LOMEDLY_SSH_KEY secret or HOST_KEY), skipping."
            echo "go=no" >> "$GITHUB_OUTPUT"
          else
            echo "go=yes" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.ready.outputs.go == 'yes'

      - name: Copy the site to the server
        if: steps.ready.outputs.go == 'yes'
        env:
          KEY: ${{ secrets.LOMEDLY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          echo "$HOST $HOST_KEY" > ~/.ssh/known_hosts
          rsync -rlz --delete --chmod=D755,F644 \
            --exclude='.git/' --exclude='.github/' --exclude='CLAUDE.md' --exclude='README.md' \
            -e "ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes" \
            ./ "jacob@$HOST:/"

      - name: Check the site answers
        if: steps.ready.outputs.go == 'yes'
        run: curl -fsS -o /dev/null -w "%{http_code}\n" https://lomedly.jacob-apps.co.il/index.html
