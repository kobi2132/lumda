<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>הלומדות שלי</title>
<link rel="manifest" href="manifest.webmanifest?v=3">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="לומדות">
<meta name="theme-color" content="#ff4f9a">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Varela+Round&display=swap">
<style>
/* Hub: "who's playing?" picker (tap your character, hear a welcome), then that child's apps. Kids come from kids.js, apps from apps/catalog.js. */
:root{--plum:#4e1f63;--gold:#ffbf2e;--accent:#ff4f9a;--ink:#4e1f63;
  --bg:linear-gradient(170deg,#ffc6e3 0%,#f3c4ff 55%,#d7c0ff 100%);
  --font:"Varela Round",system-ui,sans-serif;--display:"Fredoka","Varela Round",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;min-height:100vh;font-family:var(--font);color:var(--ink);background:var(--bg);background-color:#e9c6f0;
  transition:background .6s;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.wrap{max-width:900px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) 16px 40px;min-height:100vh;display:flex;flex-direction:column}
h1{margin:12px 0 18px;text-align:center;font-family:var(--display);font-size:clamp(34px,9vw,60px);color:#fff;
  text-shadow:0 3px 0 #b03a8f,0 6px 18px rgba(78,31,99,.3)}
button{font:inherit;color:inherit}

/* Picker */
#pick:not([hidden]){flex:1;display:flex;flex-direction:column}
.kids{flex:1;display:grid;grid-template-columns:1fr 1fr;align-content:center;padding-bottom:8vh;gap:clamp(12px,4vw,40px);align-items:end;max-width:760px;width:100%;margin:0 auto}
.kid{border:0;background:none;padding:0;cursor:pointer;min-width:0;display:flex;flex-direction:column;align-items:center;gap:10px}
.kid .fig{width:100%;height:min(52vh,72vw,520px);display:flex;align-items:flex-end;justify-content:center;
  animation:idle 3.4s ease-in-out infinite}
.kid:nth-child(2) .fig{animation-delay:-1.7s}
.kid img{height:100%;width:auto;max-width:none;filter:drop-shadow(0 10px 14px rgba(40,10,60,.3));-webkit-user-drag:none}
.kid .name{font-family:var(--display);font-weight:700;font-size:clamp(28px,8vw,48px);color:#fff;border-radius:999px;padding:6px 30px;
  border:4px solid #fff;box-shadow:0 6px 0 rgba(40,10,60,.25)}
.kid[data-k="melody"] .name{background:linear-gradient(180deg,#ff8fc0,#e0307f)}
.kid[data-k="yam"] .name{background:linear-gradient(180deg,#5b7bd6,#2b3a8f);border-color:var(--gold)}
.kid:active .fig{transform:scale(.97)}
.kid.chosen .fig{animation:jump .9s ease-out}
.kids.picked .kid:not(.chosen){opacity:.35;transition:opacity .4s}
@keyframes idle{50%{transform:translateY(-8px)}}
@keyframes jump{30%{transform:translateY(-34px) scale(1.06)}60%{transform:translateY(0)}78%{transform:translateY(-10px)}}

/* Apps */
.top{display:flex;align-items:center;gap:12px;margin:4px 0 18px}
.me{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.me img{height:84px;filter:drop-shadow(0 4px 6px rgba(40,10,60,.3))}
.me .hi{font-family:var(--display);font-weight:700;font-size:clamp(26px,7vw,40px);color:#fff;text-shadow:0 3px 0 rgba(40,10,60,.35)}
.switch{border:3px solid #fff;background:rgba(40,10,60,.35);color:#fff;border-radius:999px;padding:8px 16px;font-size:16px;cursor:pointer;flex:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;text-decoration:none;color:var(--plum);
  background:#fff;border:5px solid #fff;border-radius:28px;padding:18px 14px 16px;box-shadow:0 7px 0 rgba(40,10,60,.22)}
.app:active{transform:translateY(4px);box-shadow:0 3px 0 rgba(40,10,60,.22)}
.app .icon{font-size:80px;line-height:1.1}
.app h2{margin:0;font-size:24px}
.app p{margin:0;font-size:15px;line-height:1.45;opacity:.85}
.empty{text-align:center;color:#fff;font-size:22px;line-height:1.6;padding:30px 10px;font-family:var(--display)}
.empty .big{font-size:70px;display:block}
[hidden]{display:none!important}
@media (orientation:landscape) and (max-height:520px){ .kid .fig{height:min(60vh,300px)} h1{margin:4px 0 8px;font-size:30px} }
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <section id="pick">
    <h1>מי משחק היום?</h1>
    <div class="kids" id="kids"></div>
  </section>
  <section id="list" hidden>
    <div class="top">
      <div class="me"><img id="meImg" alt=""><span class="hi" id="hi"></span></div>
      <button class="switch" id="switch">החלפת ילד</button>
    </div>
    <div class="grid" id="grid"></div>
  </section>
</div>
<script src="kids.js"></script>
<script src="apps/catalog.js"></script>
<script>
const KIDS = window.LUMDA_KIDS || {}, APPS = window.LUMDA_APPS || [];
const $ = id => document.getElementById(id);
const store = (k,v) => { try { v===null ? localStorage.removeItem(k) : localStorage.setItem(k,v) } catch(e){} };

/* Voice: the welcome is spoken in the child's own gender, with a male voice for boys where the phone has one */
const synth = window.speechSynthesis;
function heVoice(kind){
  const vs = (synth && synth.getVoices() || []).filter(v => /^(he|iw)/i.test(v.lang));
  const male = /male(?!.*female)|asaf|avri|david|guy|man/i, female = /female|carmit|hila|woman/i;
  return (kind==='male' ? vs.find(v=>male.test(v.name)) : vs.find(v=>female.test(v.name))) || vs[0] || null;
}
function welcome(kid){
  return new Promise(done => {
    if(!synth){ setTimeout(done,900); return }
    try { synth.cancel() } catch(e){}
    const u = new SpeechSynthesisUtterance(kid.welcomeSay || kid.welcome);
    const v = heVoice(kid.voice); u.lang = v ? v.lang : 'he-IL'; if(v) u.voice = v;
    u.rate = .95; u.pitch = kid.voice==='male' && !(v && /male/i.test(v.name)) ? .8 : 1.15;
    let fin = false; const end = () => { if(!fin){ fin = true; done() } };
    u.onend = end; u.onerror = end; setTimeout(end, 3500);
    synth.speak(u);
  });
}
if(synth) synth.onvoiceschanged = () => {};

function theme(kid){
  const r = document.documentElement.style;
  r.setProperty('--bg', kid ? kid.theme.bg : ''); r.setProperty('--ink', kid ? kid.theme.ink : '');
  document.querySelector('meta[name=theme-color]').content = kid ? kid.theme.accent : '#ff4f9a';
}

function showPick(){
  theme(null); $('list').hidden = true; $('pick').hidden = false;
  const box = $('kids'); box.classList.remove('picked');
  box.innerHTML = Object.values(KIDS).map(k =>
    `<button class="kid" data-k="${k.id}" aria-label="${k.name}"><span class="fig"><img src="${k.img}" alt="" draggable="false"></span><span class="name">${k.name}</span></button>`).join('');
  box.querySelectorAll('.kid').forEach(b => b.onclick = async () => {
    if(box.classList.contains('picked')) return;
    const kid = KIDS[b.dataset.k];
    box.classList.add('picked'); b.classList.add('chosen');
    store('lumda-kid', kid.id); try { sessionStorage.setItem('lumda-kid', kid.id) } catch(e){}
    theme(kid);
    await welcome(kid);
    showList(kid);
  });
}

function showList(kid){
  theme(kid); $('pick').hidden = true; $('list').hidden = false;
  $('meImg').src = kid.img; $('hi').textContent = 'שלום ' + kid.name;
  const list = APPS.filter(a => !a.kids || a.kids.includes(kid.id));
  const grid = $('grid');
  grid.innerHTML = list.length ? '' : `<div class="empty"><span class="big">⚔️🐉</span>${kid.gender==='m' ? 'הלומדות שלך בדרך, אביר!' : 'הלומדות שלך בדרך!'}</div>`;
  list.forEach(a => {
    const el = document.createElement('a');
    el.className = 'app'; el.href = a.path;
    el.innerHTML = '<div class="icon"></div><h2></h2><p></p>';
    el.querySelector('.icon').textContent = a.icon;
    el.querySelector('h2').textContent = (a.titles && a.titles[kid.id]) || a.title;
    el.querySelector('p').textContent = a.description;
    grid.appendChild(el);
  });
}
$('switch').onclick = () => { try { sessionStorage.removeItem('lumda-kid') } catch(e){} showPick() };

// coming back from an app in the same visit: stay with the same child
let back = null; try { back = KIDS[sessionStorage.getItem('lumda-kid')] } catch(e){}
back ? showList(back) : showPick();

if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
