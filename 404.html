<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>לומדלי עבר לכתובת חדשה</title>
<link rel="icon" href="/lumda/logo-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Varela+Round&display=swap">
<style>
:root{--bg1:#ffe3f1;--bg2:#e6d6ff;--ink:#4a2a6b;--soft:#7a5a96;--pink:#ff4f9a;--pinkD:#d63a7f;--card:#fff}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--ink);font-family:"Varela Round",system-ui,sans-serif;
  min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:var(--card);border-radius:28px;box-shadow:0 10px 30px rgba(74,42,107,.15);padding:28px 22px;max-width:420px;width:100%;text-align:center}
img{width:96px;height:96px;border-radius:24px}
h1{font-family:"Fredoka","Varela Round",sans-serif;font-size:1.6rem;margin:14px 0 10px}
p{font-size:1.05rem;line-height:1.55;margin:10px 0;color:var(--soft)}
.addr{direction:ltr;font-family:"Fredoka",sans-serif;font-size:1.1rem;color:var(--ink);word-break:break-all}
a.btn{display:inline-block;margin:16px 0 8px;padding:14px 30px;min-height:44px;border-radius:999px;background:var(--pink);color:#fff;
  text-decoration:none;font-family:"Fredoka",sans-serif;font-size:1.25rem;box-shadow:0 5px 0 var(--pinkD)}
a.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--pinkD)}
.small{font-size:.95rem}
</style>
</head>
<body>
<div class="card">
  <img src="/lumda/logo-192.png" alt="">
  <h1>לומדלי עבר לכתובת חדשה</h1>
  <p>כדי שלומדלי יהיה יציב יותר, עברנו לכתובת קבועה משלנו.</p>
  <p>מעכשיו נכנסים ל:<br><span class="addr">lomedly.jacob-apps.co.il</span></p>
  <a class="btn" href="https://lomedly.jacob-apps.co.il/">מעבר ללומדלי</a>
  <p class="small">אם לומדלי מותקן בטלפון, מוחקים את האייקון הישן ומתקינים מחדש מהכתובת החדשה.</p>
  <p class="small">עמכם הסליחה על אי הנוחות.</p>
</div>
</body>
</html>
