<title>חשבון</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Varela+Round&display=swap">
<style>
/* Shared look copied from the English app (apps/melody-english), then the numbers additions below.
   Layout: one-screen castle app — header (home · title · stars), a big centered stage, sparkles drifting on a canvas behind everything. Single bright look on purpose. */
:root{
  --rose:#ff4f9a;
  --rose-deep:#e0307f;
  --blush:#ffd9ec;
  --lilac:#b98cff;
  --plum:#4e1f63;
  --gold:#ffbf2e;
  --gold-soft:#fff0c2;
  --pearl:#fff8fc;
  --mint:#2fc79a;
  --display:"Fredoka","Varela Round","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Varela Round","Fredoka",system-ui,sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  background:
    radial-gradient(120% 70% at 85% 0%,#ffe3f3 0%,transparent 60%),
    radial-gradient(90% 60% at 0% 100%,#e7d6ff 0%,transparent 65%),
    linear-gradient(170deg,#ffc6e3 0%,#f3c4ff 55%,#d7c0ff 100%);
  background-color:#f6c7ec;
  color:var(--plum);font-family:var(--body);
  overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;
}
#sky{position:fixed;inset:0;pointer-events:none;z-index:0}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
.app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 14px;
  max-width:760px;margin:0 auto;box-sizing:border-box}
header{display:flex;align-items:center;gap:10px;min-height:58px}
.title{flex:1;min-width:0;text-align:center;font-family:var(--display);font-weight:700;font-size:clamp(20px,5.4vw,30px);
  color:var(--rose-deep);text-shadow:0 2px 0 #fff,0 0 14px #fff;text-wrap:balance;line-height:1.1}
.round-btn{width:54px;height:54px;border-radius:50%;border:3px solid #fff;background:linear-gradient(160deg,#fff 0%,var(--blush) 100%);
  box-shadow:0 4px 0 #f0a8cf,0 6px 14px rgba(78,31,99,.18);display:grid;place-items:center;cursor:pointer;flex:none;padding:0}
.round-btn svg{width:28px;height:28px}
.round-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #f0a8cf}
.round-btn[hidden]{display:none!important}
.stars{display:flex;align-items:center;gap:4px;background:#fff;border:3px solid var(--gold);border-radius:30px;padding:4px 12px 4px 10px;
  font-family:var(--display);font-weight:700;font-size:24px;color:#b37800;box-shadow:0 4px 0 #f2c35a;flex:none;font-variant-numeric:tabular-nums;cursor:pointer}
.stars:active{transform:translateY(3px);box-shadow:0 1px 0 #f2c35a}
.stars .s{font-size:24px;line-height:1}
.stars.pop{animation:pop .5s}
@keyframes pop{40%{transform:scale(1.35)}}
main{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:8px 12px 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:16px}
.screen{width:100%;display:flex;flex-direction:column;align-items:center;gap:16px;flex-shrink:0;margin-block:auto;padding-bottom:18px}
button{font:inherit;color:inherit}
button:focus-visible{outline:4px solid var(--gold);outline-offset:3px}

/* Home */
.hello{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.crown-big{font-size:min(30vw,150px);line-height:1;filter:drop-shadow(0 8px 0 rgba(224,48,127,.25));animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px) rotate(-3deg)}}
.hello h1{margin:0;font-family:var(--display);font-size:clamp(34px,10vw,58px);color:#fff;
  text-shadow:0 3px 0 var(--rose-deep),0 6px 18px rgba(224,48,127,.4);letter-spacing:.5px}
.play{font-family:var(--display);font-weight:700;font-size:clamp(26px,7vw,36px);color:#fff;border:4px solid #fff;border-radius:999px;
  padding:16px 34px;cursor:pointer;display:flex;align-items:center;gap:12px;
  background:linear-gradient(180deg,#ff7cb5 0%,var(--rose) 50%,var(--rose-deep) 100%);
  box-shadow:0 7px 0 #b81f63,0 12px 26px rgba(184,31,99,.35);animation:breathe 1.8s ease-in-out infinite}
.play:active{transform:translateY(5px);box-shadow:0 2px 0 #b81f63}
.play svg{width:34px;height:34px}
@keyframes breathe{50%{transform:scale(1.06)}}
.parent-note{font-size:13px;color:#7a4a8c;text-align:center;max-width:32ch;line-height:1.5}

/* Categories */
.cats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%;max-width:600px}
.cat{border:4px solid #fff;border-radius:24px;padding:10px 4px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;
  box-shadow:0 6px 0 rgba(78,31,99,.18);position:relative;overflow:hidden}
.cat:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(78,31,99,.18)}
.cat .pic{height:clamp(46px,13vw,72px);width:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}
.cat .pic .art{height:100%;width:100%;filter:drop-shadow(0 3px 3px rgba(78,31,99,.25))}
.cat .pic .starbox{width:80%!important;gap:0}.cat .pic .starbox span{font-size:clamp(15px,4.4vw,24px)!important}.cat .pic .shape{width:auto!important;height:100%}
.cat .en{font-family:var(--display);font-weight:700;font-size:clamp(15px,4.4vw,21px);line-height:1.1;color:#fff;text-shadow:0 2px 0 rgba(78,31,99,.35)}
.cat .he{font-size:13px;color:#fff;opacity:.95}
.cat::after{content:"";position:absolute;inset:-40% auto auto -30%;width:60%;height:180%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);
  transform:rotate(25deg);animation:shine 4.5s ease-in-out infinite}
@keyframes shine{0%,70%{left:-60%}100%{left:130%}}
.cat:nth-child(1){background:linear-gradient(160deg,#ff9ac9,#ff4f9a)}
.cat:nth-child(2){background:linear-gradient(160deg,#c6a4ff,#9566f2)}
.cat:nth-child(3){background:linear-gradient(160deg,#ffcf6b,#ff9c3a)}
.cat:nth-child(4){background:linear-gradient(160deg,#7fe3c4,#29b98d)}
.cat:nth-child(5){background:linear-gradient(160deg,#8fd0ff,#5b8dff)}
.cat:nth-child(6){background:linear-gradient(160deg,#ffb2e0,#d46cff)}
.cat:nth-child(2)::after{animation-delay:.7s}.cat:nth-child(3)::after{animation-delay:1.4s}.cat:nth-child(4)::after{animation-delay:2.1s}.cat:nth-child(5)::after{animation-delay:2.8s}.cat:nth-child(6)::after{animation-delay:3.5s}

.shelf{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;background:rgba(255,255,255,.55);border:3px dashed #fff;border-radius:22px;padding:8px 12px;max-width:520px}
.gem{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:26px;background:#fff;border:2px solid var(--gold);cursor:pointer;padding:0}
.gem.locked{background:rgba(255,255,255,.4);border-color:rgba(255,255,255,.8);font-size:18px;color:#c79ad9;cursor:default}

/* Learn card */
.card{width:min(100%,400px);background:linear-gradient(180deg,#fff 0%,var(--pearl) 100%);border-radius:36px;border:5px solid var(--gold);
  box-shadow:0 0 0 6px #fff,0 10px 0 6px #f2c35a,0 22px 16px -8px rgba(78,31,99,.28);
  display:flex;flex-direction:column;align-items:center;padding:18px 16px 16px;gap:4px;cursor:pointer;position:relative}
.card.enter{animation:cardIn .45s cubic-bezier(.3,1.5,.5,1)}
@keyframes cardIn{from{transform:scale(.6) rotate(-6deg);opacity:0}}
.card .visual{height:min(34vh,210px);display:grid;place-items:center;width:100%}
.emoji{font-size:min(30vh,180px);line-height:1}
.word-en{font-family:var(--display);font-weight:700;font-size:clamp(44px,13vw,68px);color:var(--rose-deep);line-height:1.05;direction:ltr}
.word-he{font-size:20px;color:#8a5a9c}
.speaker{position:absolute;top:12px;left:12px;width:40px;height:40px;opacity:.75}
.progress{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.dot{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.7)}
.dot.on{background:var(--rose);box-shadow:0 0 0 2px #fff}
.nav{display:flex;align-items:center;justify-content:center;gap:clamp(8px,3vw,18px);width:100%}
.arrow{width:76px;height:76px;border-radius:50%;border:4px solid #fff;cursor:pointer;display:grid;place-items:center;padding:0;
  background:linear-gradient(180deg,#d7b8ff,var(--lilac));box-shadow:0 6px 0 #8a5ad6}
.arrow.next{background:linear-gradient(180deg,#ff8fc0,var(--rose));box-shadow:0 6px 0 #b81f63;animation:breathe 1.6s ease-in-out infinite}
.arrow:active{transform:translateY(4px);box-shadow:none}
.arrow svg{width:38px;height:38px}
.arrow:disabled{opacity:.35;animation:none}
.wand{font-family:var(--display);font-weight:700;font-size:24px;color:var(--plum);border:4px solid #fff;border-radius:999px;padding:10px 24px;cursor:pointer;
  background:linear-gradient(180deg,#fff3c4,var(--gold));box-shadow:0 6px 0 #d49a12;display:flex;align-items:center;gap:8px}
.wand:active{transform:translateY(4px);box-shadow:none}

/* Game */
.ask{display:flex;align-items:center;gap:12px;background:#fff;border-radius:30px;padding:10px 20px 10px 12px;border:4px solid var(--lilac);
  box-shadow:0 6px 0 #9c74e6;cursor:pointer}
.ask .q{font-family:var(--display);font-weight:700;font-size:clamp(30px,9vw,46px);color:var(--plum);direction:ltr}
.ask svg{width:40px;height:40px;flex:none}
.options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:100%;max-width:560px}
.opt{aspect-ratio:1;max-width:100%;border-radius:28px;border:5px solid #fff;background:linear-gradient(180deg,#fff,var(--blush));
  box-shadow:0 7px 0 #f0a8cf;cursor:pointer;display:grid;place-items:center;padding:6px;overflow:hidden}
.opt{container-type:inline-size}
.opt .starbox{width:100%!important;gap:0}
.opt .emoji{font-size:clamp(46px,16vw,96px)}
.opt:active{transform:translateY(4px);box-shadow:0 3px 0 #f0a8cf}
.opt.right{border-color:var(--mint);background:linear-gradient(180deg,#fff,#c9f5e6);animation:pop .6s}
.opt.wrong{animation:shake .45s;opacity:.55}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.round{font-family:var(--display);font-size:20px;color:#fff;text-shadow:0 2px 0 rgba(78,31,99,.3)}

/* Color & number visuals */
.blob{width:min(28vh,170px);aspect-ratio:1;max-width:100%;border-radius:50%;position:relative;box-shadow:inset -12px -16px 0 rgba(0,0,0,.12),0 8px 18px rgba(0,0,0,.15)}
.blob::after{content:"";position:absolute;top:16%;left:20%;width:26%;height:18%;border-radius:50%;background:rgba(255,255,255,.65);transform:rotate(-25deg)}
.opt .blob{width:78%}
.starbox{display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:2px;max-width:100%;direction:ltr}
.starbox span{line-height:1}

/* Celebration */
.party{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.party .crown-big{font-size:min(34vw,170px)}
.party h2{margin:0;font-family:var(--display);font-size:clamp(36px,11vw,60px);color:#fff;text-shadow:0 3px 0 var(--rose-deep),0 0 20px #fff}
.party p{margin:0;font-size:22px;color:var(--plum)}
.row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}

/* Game picker */
.picker{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;width:100%;max-width:480px}
.game-btn{border:4px solid #fff;border-radius:28px;padding:16px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;
  box-shadow:0 7px 0 rgba(78,31,99,.2)}
.game-btn:active{transform:translateY(4px);box-shadow:0 3px 0 rgba(78,31,99,.2)}
.game-btn .pic{font-size:clamp(48px,15vw,76px);line-height:1}
.game-btn .en{font-family:var(--display);font-weight:700;font-size:clamp(20px,5.6vw,26px);color:#fff;text-shadow:0 2px 0 rgba(78,31,99,.35)}
.picker-title{font-family:var(--display);font-weight:700;font-size:clamp(28px,8vw,40px);color:#fff;text-shadow:0 3px 0 var(--rose-deep)}
.cat-chip{display:flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:6px 16px;border:3px solid var(--lilac);font-family:var(--display);font-weight:700;font-size:20px;color:var(--plum)}

/* Balloons */
.screen.fill{flex:1 0 auto}
.air{position:relative;width:100%;max-width:640px;flex:1;min-height:330px;overflow:hidden;border-radius:30px;
  background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,.08));border:3px solid rgba(255,255,255,.7)}
.balloon{position:absolute;top:110%;width:22%;max-width:130px;aspect-ratio:.82;border:0;padding:0;cursor:pointer;background:none;
  animation:rise var(--d) linear var(--delay) infinite;container-type:inline-size}
.balloon .skin{position:absolute;inset:0;border-radius:50% 50% 47% 47%/56% 56% 44% 44%;display:grid;place-items:center;
  background:radial-gradient(circle at 30% 26%,rgba(255,255,255,.85) 0 9%,rgba(255,255,255,0) 10%),radial-gradient(circle at 50% 40%,var(--b2),var(--b));
  box-shadow:inset -8px -10px 0 rgba(0,0,0,.1)}
.balloon .skin::after{content:"";position:absolute;bottom:-7px;left:50%;margin-left:-7px;border:7px solid transparent;border-bottom:9px solid var(--b);transform:rotate(180deg) translateY(-2px);transform-origin:center}
.balloon::after{content:"";position:absolute;top:calc(100% + 8px);left:50%;width:2px;height:46px;background:rgba(78,31,99,.35)}
.balloon .face{width:72%;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.88);display:grid;place-items:center;container-type:inline-size}
.balloon .face .emoji{font-size:62cqw}
.balloon .face .blob{width:78%}
.balloon .face .starbox{width:94%!important}
.balloon.wrong .skin{animation:shake .45s}
.balloon.popped{animation:none;transition:transform .25s,opacity .25s;transform:scale(1.6);opacity:0;pointer-events:none}
@keyframes rise{from{top:110%}to{top:-55%}}

/* Memory */
.mem{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:100%;max-width:440px}
.mcard{aspect-ratio:.8;max-width:100%;border:0;padding:0;background:none;cursor:pointer;perspective:700px}
.mcard .in{display:block;position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.mcard.open .in,.mcard.done .in{transform:rotateY(180deg)}
.mcard .face,.mcard .back{position:absolute;inset:0;border-radius:22px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center;border:4px solid #fff}
.mcard .back{background:repeating-linear-gradient(45deg,#ff8fc0 0 12px,#ff6fae 12px 24px);box-shadow:0 6px 0 #c9387a;font-size:clamp(34px,10vw,52px)}
.mcard .face{transform:rotateY(180deg);background:linear-gradient(180deg,#fff,var(--blush));box-shadow:0 6px 0 #f0a8cf;container-type:inline-size}
.mcard .face .emoji{font-size:58cqw}
.mcard .face .blob{width:70%}
.mcard .face .starbox{width:92%!important}
.mcard.done .face{border-color:var(--mint);background:linear-gradient(180deg,#fff,#c9f5e6)}

/* Magic dress */
.dress{width:min(58vw,225px);height:auto;max-width:100%;overflow:visible}
.dress .part{stroke:#7b4592;stroke-width:3;stroke-linejoin:round;transition:fill .6s}
.dress .part.glow{animation:glow 1s ease-in-out infinite}
@keyframes glow{50%{stroke:#ffbf2e;stroke-width:7}}
.palette{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.paint{width:clamp(58px,17vw,78px);aspect-ratio:1;border-radius:50%;border:5px solid #fff;cursor:pointer;padding:0;
  box-shadow:inset -6px -8px 0 rgba(0,0,0,.14),0 6px 0 rgba(78,31,99,.2)}
.paint:active{transform:translateY(4px)}
.paint.wrong{animation:shake .45s}

/* Level path */
.path{display:flex;align-items:center;justify-content:center;gap:0;flex-wrap:wrap;row-gap:18px;width:100%;max-width:560px}
.lvl{position:relative;width:clamp(96px,27vw,128px);aspect-ratio:1;border-radius:50%;border:5px solid #fff;cursor:pointer;padding:0;
  display:grid;place-items:center;background:linear-gradient(180deg,#fff,var(--blush));box-shadow:0 7px 0 #f0a8cf;container-type:inline-size}
.lvl .emoji{font-size:48cqw}
.lvl .blob{width:56%}.lvl .shape{width:60%!important}.lvl .starbox{width:80%!important}
.lvl.now{border-color:var(--gold);animation:breathe 1.6s ease-in-out infinite;box-shadow:0 0 0 6px rgba(255,191,46,.45),0 7px 0 #f0a8cf}
.lvl.done{background:linear-gradient(180deg,#fff,#fff0c2)}
.lvl.locked{filter:grayscale(.85);opacity:.55}
.lvl .badge{position:absolute;top:-10px;inset-inline-end:-6px;font-size:30px;line-height:1;filter:drop-shadow(0 2px 2px rgba(0,0,0,.2))}
.lvl.locked .badge{font-size:26px}
.link{width:clamp(18px,6vw,40px);height:8px;border-radius:4px;background:repeating-linear-gradient(90deg,#fff 0 8px,transparent 8px 14px)}
.lvl-crown{font-size:clamp(56px,16vw,84px);line-height:1;filter:grayscale(1) opacity(.35);transition:filter .4s}
.lvl-crown.won{filter:drop-shadow(0 6px 0 rgba(224,48,127,.25));animation:bob 3s ease-in-out infinite}

/* Home tile progress */
.cat .lvdots{display:flex;gap:4px;justify-content:center;margin-top:2px}
.cat .lvdots i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.45);border:1.5px solid #fff}
.cat .lvdots i.on{background:var(--gold)}
.cat .won{position:absolute;top:2px;inset-inline-start:4px;font-size:clamp(20px,6vw,28px);line-height:1;z-index:1;filter:drop-shadow(0 2px 1px rgba(0,0,0,.25))}

/* Hint */
.hint{animation:hintGlow 1s ease-in-out infinite!important}
@keyframes hintGlow{50%{box-shadow:0 0 0 9px var(--gold),0 0 26px 10px rgba(255,191,46,.8);transform:scale(1.07)}}
.balloon.hint .skin{animation:hintGlow 1s ease-in-out infinite}
.balloon.hint{animation:none!important}

/* Album */
.album-btn{display:flex;align-items:center;gap:10px;border:4px solid #fff;border-radius:999px;padding:8px 20px 8px 14px;cursor:pointer;
  background:linear-gradient(180deg,#fff3c4,var(--gold));box-shadow:0 6px 0 #d49a12;font-family:var(--display);font-weight:700;font-size:22px;color:var(--plum)}
.album-btn:active{transform:translateY(4px);box-shadow:none}
.album-btn .mini{display:flex;gap:2px;font-size:22px}
.next-stk{display:flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:6px 14px;border:3px solid var(--gold);font-size:24px}
.next-stk .gift{font-size:28px}
.album{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;width:100%;max-width:440px;
  background:rgba(255,255,255,.55);border:4px solid #fff;border-radius:28px;padding:12px}
.stk{aspect-ratio:1;max-width:100%;border-radius:20px;border:3px dashed rgba(185,140,255,.6);background:rgba(255,255,255,.5);
  display:grid;place-items:center;padding:0;cursor:pointer;container-type:inline-size;position:relative;overflow:hidden}
.stk span{font-size:58cqw;line-height:1}
.stk.locked span{filter:grayscale(1) brightness(0);opacity:.13}
.stk.got{border:4px solid #fff;background:radial-gradient(circle at 50% 40%,#fff 0 45%,var(--gold-soft) 100%);box-shadow:0 4px 0 #f2c35a}
.stk.got span{filter:drop-shadow(0 3px 0 rgba(78,31,99,.18))}
.stk.got::after{content:"";position:absolute;inset:-40% auto auto -40%;width:50%;height:180%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.8),transparent);transform:rotate(25deg);animation:shine 3.5s ease-in-out infinite}
.stk.fresh{animation:pop .8s 2}

/* Princess Melody companion */
.pm{position:relative;display:block}
.pm-in{display:block;height:100%;transform-origin:50% 100%}
.pm-pic{position:relative;display:block;width:100%;height:100%;transform-origin:50% 100%}
.pm .mouth{position:absolute;max-width:none;display:block;object-fit:fill;pointer-events:none}
.pm .pm-img{display:block;width:100%;height:100%;object-fit:contain;transform-origin:50% 100%;pointer-events:none;
  filter:drop-shadow(0 8px 12px rgba(78,31,99,.22))}
.pm-spark{position:absolute;top:2%;left:58%;width:16%;aspect-ratio:1;pointer-events:none;
  background:radial-gradient(circle,#fff 0 18%,transparent 20%),conic-gradient(from 45deg,transparent 0 10%,#fff 12% 13%,transparent 15% 35%,#fff 37% 38%,transparent 40% 60%,#fff 62% 63%,transparent 65% 85%,#fff 87% 88%,transparent 90%);
  border-radius:50%;animation:twinkle 2.2s ease-in-out infinite}
.pm.bust .pm-spark{top:0;left:60%;width:20%}
/* talking: the mouth moves (see startMouth) and she sways gently */
.talking .pm .pm-pic{animation:pmSway 1.6s ease-in-out infinite}
@keyframes pmSway{0%,100%{transform:rotate(0)}25%{transform:rotate(-1.2deg)}75%{transform:rotate(1.2deg)}}
@keyframes pmTalk{from{transform:scale(1);filter:drop-shadow(0 8px 12px rgba(78,31,99,.22))}
  to{transform:scale(1.035) translateY(-2px);filter:drop-shadow(0 0 10px rgba(255,111,181,.9)) drop-shadow(0 8px 12px rgba(78,31,99,.2))}}
.pm-happy .pm .pm-in{animation:pmJump .8s ease-out}
.pm-oops .pm .pm-in{animation:pmTilt 1s ease-in-out}
@keyframes pmJump{30%{transform:translateY(-22px) scale(1.05)}60%{transform:translateY(0)}78%{transform:translateY(-7px)}}
@keyframes pmTilt{25%,75%{transform:rotate(-7deg)}}
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(.5)}50%{opacity:1;transform:scale(1.1)}}
@keyframes pmIdle{50%{transform:translateY(-5px)}}
.pm.big{height:min(46vh,330px);aspect-ratio:440/702;max-width:100%;animation:pmIdle 3.4s ease-in-out infinite}
.party .pm.big{height:min(36vh,270px)}
.pm.big.won{animation:pop .9s}
main{position:relative;z-index:1}
/* the companion's bar is as tall as the whole figure and sits above the scrolling page, so her crown / his hair is never hidden behind the tiles */
.buddy-bar{--bh:clamp(92px,16vh,132px);position:relative;height:calc(var(--bh)*1.08 + 6px);flex:none;z-index:2;pointer-events:none}
.buddy{pointer-events:auto}
/* a scrolling page fades out at the bottom instead of being sliced */
main.scrollable{-webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 34px),transparent);mask-image:linear-gradient(to bottom,#000 calc(100% - 34px),transparent)}
.buddy{position:absolute;bottom:0;inset-inline-start:0;height:calc(var(--bh)*1.08);aspect-ratio:300/328;border:0;background:none;padding:0;cursor:pointer;animation:pmIdle 3.4s ease-in-out infinite}
.buddy .pm{width:100%;height:100%}

/* Interface icons */
.art.ico{width:1.35em;height:1.35em;display:inline-block;vertical-align:middle}
.art.inl{width:1.3em;height:1.3em;display:inline-block;vertical-align:-.3em}
.stars .s{display:inline-flex;width:24px;height:24px}.stars .s .art{width:100%;height:100%}
.round{display:flex;gap:4px;justify-content:center}.round .art{width:24px;height:24px}
.art.off{filter:grayscale(1);opacity:.35}
.next-stk .art{width:26px;height:26px}.next-stk .gift{display:inline-flex;width:32px;height:32px}.next-stk .gift .art{width:100%;height:100%}
.starbox .st{display:inline-block;width:1.05em;height:1.05em;line-height:0}.starbox .st .art{width:100%;height:100%}
.cat .won{width:clamp(22px,7vw,32px);height:clamp(22px,7vw,32px)}.cat .won .art{width:100%;height:100%}
.lvl .badge{width:36px;height:36px}.lvl .badge .art{width:100%;height:100%}
.lvl-crown{width:clamp(56px,16vw,84px);height:clamp(56px,16vw,84px);display:inline-flex}.lvl-crown .art{width:100%;height:100%}
.game-btn .pic{height:clamp(56px,16vw,84px);width:100%;display:flex;justify-content:center}.game-btn .pic .art{height:100%;width:auto;max-width:90%}
/* Illustrations */
.art{display:block;max-width:100%;max-height:100%;object-fit:contain;-webkit-user-drag:none;user-select:none}
.card .visual{display:flex;align-items:center;justify-content:center;min-height:0}
.card .visual .art{height:100%;width:100%;min-height:0}
.card .visual .art.famrow{height:auto;max-height:100%;width:100%}
.opt .art{width:86%;height:86%}
.balloon .face .art{width:80%;height:80%}
.mcard .face .art{width:82%;height:82%}
.mcard .back .art{width:62%;height:62%;filter:drop-shadow(0 3px 3px rgba(120,20,70,.35))}
.lvl .art{width:66%;height:66%}
.chip-pic{display:grid;place-items:center;width:30px;height:30px}
.chip-pic .art{width:100%;height:100%}.chip-pic .starbox{width:30px!important;font-size:9px}.chip-pic .starbox span{font-size:10px!important}.chip-pic .shape{width:28px!important}
.stk .art{width:78%;height:78%}
.stk.locked .art{filter:grayscale(1) brightness(0);opacity:.13}
.stk.got .art{filter:drop-shadow(0 3px 0 rgba(78,31,99,.18))}
.album-btn .mini{align-items:center}.album-btn .mini .art{width:26px;height:26px}
@media (min-width:700px){
  .cats{grid-template-columns:repeat(5,minmax(0,1fr));max-width:720px}
}
@media (max-height:700px){
  .cats{gap:8px}.cat{padding:6px 4px 6px;border-radius:20px}.cat .pic{height:clamp(40px,9vh,56px)}.cat .he{font-size:12px}
  .gem{width:32px;height:32px;font-size:20px}.shelf{gap:6px;padding:6px 10px}
  .card .visual{height:min(30vh,180px)}.emoji{font-size:min(26vh,160px)}.arrow{width:64px;height:64px}
  .crown-big{font-size:min(26vw,110px)}
  .air{min-height:260px}
  .game-btn{padding:10px 6px}.game-btn .pic{height:clamp(44px,11vw,60px)}.picker{gap:10px}.picker-title{font-size:clamp(24px,7vw,34px)}
  .pm.big{height:min(40vh,240px)}.party .pm.big{height:min(30vh,180px)}
  .dress{width:min(46vw,175px)}
}
@media (max-height:500px) and (orientation:landscape){
  /* the companion stands in the corner beside the page, not under it, so she is never dropped for lack of height */
  .buddy-bar{--bh:min(27vh,96px);position:fixed;bottom:0;inset-inline-start:4px;width:calc(var(--bh)*1.08*.92);height:calc(var(--bh)*1.08)}
  body:has(#buddyBar:not([hidden])) main{padding-inline-start:110px}
  /* more, shorter topic tiles per row, so a whole row is never sliced by the bottom edge */
  .cats{grid-template-columns:repeat(auto-fill,minmax(92px,1fr));max-width:none;gap:8px}.cat{padding:4px 3px 5px;gap:2px}
  .cat .pic{height:clamp(26px,9vh,36px)}.cat .en{font-size:13px;line-height:1.15}.album-btn{padding-block:4px}
  header{min-height:44px}.round-btn{width:44px;height:44px}.stars{font-size:20px;padding:2px 10px}
  .card{flex-direction:row;flex-wrap:wrap;justify-content:center;column-gap:18px;width:min(100%,560px);padding:12px}
  .card .visual{height:min(52vh,170px);width:auto;flex:0 0 auto;aspect-ratio:1}
  .card .visual .art.famrow{width:min(60vw,360px);aspect-ratio:auto}
  .word-en{font-size:clamp(34px,8vh,48px)}
  .arrow{width:56px;height:56px}
  .pm.big{height:min(56vh,200px)}.party .pm.big{height:min(44vh,160px)}
  .crown-big{font-size:min(30vh,90px)}
  .air{min-height:220px}
  .dress{width:min(40vh,150px)}
  .options{max-width:min(420px,120vh)}
  .hello{flex-direction:row;gap:18px}
  .picker{grid-template-columns:repeat(4,minmax(0,1fr));max-width:680px}
  .album{grid-template-columns:repeat(10,minmax(0,1fr));max-width:720px}
  .mem{grid-template-columns:repeat(6,minmax(0,1fr));max-width:620px}
  .party .row{flex-wrap:nowrap}
  .screen.party{display:grid;grid-template-columns:auto auto;justify-content:center;align-items:center;column-gap:28px;row-gap:10px}
  .screen.party>:first-child{grid-row:1/4}
  #dressScreen{display:grid;grid-template-columns:auto auto;grid-template-areas:"dress rb" "dress ask" "dress pal";justify-content:center;align-items:center;column-gap:28px;row-gap:10px}
  #dressScreen #rb{grid-area:rb}#dressScreen #askWrap{grid-area:ask;justify-self:center}#dressScreen .dress{grid-area:dress;width:min(60vh,190px)}#dressScreen #palette{grid-area:pal;max-width:370px;flex-wrap:nowrap}
}
/* Balloons: three bigger balloons on narrow screens; on short screens they float in place instead of rising */
.air .balloon{width:var(--bw,24%);max-width:170px}
.air.calm .balloon{top:14%!important;max-height:66%;width:var(--bw,24%);max-width:min(30%,170px);animation:bob 3.2s ease-in-out infinite;animation-delay:var(--delay)}
.air.calm .balloon::after{height:20px}
.air.calm .balloon.popped{animation:none}
/* Parent corner: opened by holding the title */
.title{cursor:default;-webkit-touch-callout:none}
.title.holding{animation:pop .6s}
.parents{width:min(100%,560px);display:flex;flex-direction:column;gap:12px;text-align:start;padding-bottom:20px}
.parents h2{margin:0;text-align:center;font-family:var(--display);font-size:28px;color:var(--plum)}
.pbox{background:#fff;border-radius:20px;padding:14px 16px;box-shadow:0 4px 0 rgba(78,31,99,.12);font-size:16px;line-height:1.5}
.pbox h3{margin:0 0 8px;font-size:18px}
.prow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid #f3e6f6}
.prow:last-child{border-bottom:0}
.prow .bar{flex:0 0 40%;height:10px;border-radius:5px;background:#f1e4f6;overflow:hidden}
.prow .bar i{display:block;height:100%;background:var(--rose)}
.pbtn{font:inherit;font-size:16px;border:2px solid var(--lilac);background:#fff;color:var(--plum);border-radius:999px;padding:8px 16px;cursor:pointer}
.pbtn.on{background:var(--lilac);color:#fff}
.pbtn.danger{border-color:#e0307f;color:#e0307f}
.pbtns{display:flex;flex-wrap:wrap;gap:8px}
.weak{display:flex;flex-wrap:wrap;gap:6px}
.weak span{background:var(--blush);border-radius:999px;padding:3px 10px;direction:ltr}
.pnote{font-size:13px;color:#7a4a8c}
.hrow{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #f3e6f6}
.hrow .ht{flex:1;text-align:right;cursor:pointer}
.hrow .hen{font-size:13px;color:#7a4a8c;direction:ltr}
.hrow button{font:inherit;border:2px solid var(--lilac);background:#fff;border-radius:999px;min-width:44px;height:40px;cursor:pointer;padding:0 8px}
.hrow.bad{background:#ffe9ec}.hrow.bad .hflag{background:#e0475f;border-color:#e0475f;color:#fff}
.hrow.hplay .ht{color:var(--rose-deep);font-weight:700}
/* Tablets: use the room */
@media (min-width:700px) and (min-height:700px){
  .app{max-width:1000px}
  header{min-height:72px}.round-btn{width:64px;height:64px}.round-btn svg{width:34px;height:34px}

/* Yam: knights and dragons */
html[data-kid="yam"]{--rose:#3f6fd8;--rose-deep:#24358f;--blush:#dfe7ff;--lilac:#7f9cff;--plum:#1f2550;--pearl:#f6f8ff;--gold:#f2b632}
html[data-kid="yam"] body{background:radial-gradient(120% 70% at 85% 0%,#e3ebff 0%,transparent 60%),radial-gradient(90% 60% at 0% 100%,#d6dcff 0%,transparent 65%),linear-gradient(170deg,#b9c9ff 0%,#a6b2f2 55%,#8f9be6 100%);background-color:#a9b6f0}
html[data-kid="yam"] .play{background:linear-gradient(180deg,#6f95ff 0%,#3f6fd8 50%,#24358f 100%);box-shadow:0 7px 0 #172466,0 12px 26px rgba(23,36,102,.35)}
html[data-kid="yam"] .play:active{box-shadow:0 2px 0 #172466}
html[data-kid="yam"] .arrow.next{background:linear-gradient(180deg,#7fa0ff,#3f6fd8);box-shadow:0 6px 0 #24358f}
html[data-kid="yam"] .round-btn{box-shadow:0 4px 0 #9fb2ee,0 6px 14px rgba(31,37,80,.18)}
html[data-kid="yam"] .mcard .back{background:repeating-linear-gradient(45deg,#5b82ea 0 12px,#3f6fd8 12px 24px);box-shadow:0 6px 0 #24358f}
html[data-kid="yam"] .opt,html[data-kid="yam"] .lvl,html[data-kid="yam"] .mcard .face{box-shadow:0 7px 0 #9fb2ee}
html[data-kid="yam"] .hello h1,html[data-kid="yam"] .party h2,html[data-kid="yam"] .picker-title{text-shadow:0 3px 0 #24358f,0 6px 18px rgba(36,53,143,.4)}
html[data-kid="yam"] .parent-note{color:#1f2550}
html[data-kid="yam"] .pm.big{aspect-ratio:401/758}
html[data-kid="yam"] #homeBtn svg{stroke:#24358f}
html[data-kid="yam"] .buddy{aspect-ratio:320/350}
/* stickers won in this game */
.new-stk .art{width:44px;height:44px}.new-stk{animation:pop .8s 2}
/* the topic she was in the middle of */
.cat.last{box-shadow:0 0 0 5px var(--gold),0 6px 0 rgba(78,31,99,.18);animation:breathe 1.8s ease-in-out infinite}
/* Letters (ABC), emoji pictures, and the new games */
.ltr{font-family:var(--display);font-weight:700;color:var(--rose-deep);line-height:1;direction:ltr;display:inline-flex;align-items:baseline;gap:.04em}
.ltr small{font-size:.72em;color:#9566f2}
.lcard{display:flex;align-items:center;justify-content:center;gap:4%;height:100%;width:100%}
.lcard .ltr{font-size:min(22vh,130px)}
.card .visual .lcard .art{height:82%;width:auto;max-width:50%}
.lcard .emoji{font-size:min(17vh,104px)}
.word-en .hl{color:#ff9c3a;text-decoration:underline;text-decoration-thickness:5px;text-underline-offset:6px}
.opt .ltr,.mcard .face .ltr,.balloon .face .ltr,.lvl .ltr{font-size:40cqw}
.whats .visual .ltr{font-size:min(26vh,160px)}
.cat .pic .ltr{font-size:clamp(28px,8vw,44px);color:#fff;text-shadow:0 3px 0 rgba(78,31,99,.35)}
.cat .pic .emoji{font-size:clamp(38px,11vw,60px)}
.chip-pic .ltr{font-size:15px}.chip-pic .emoji{font-size:24px}
.opt .emoji{font-size:52cqw}
.game-btn .pic .emo{font-size:clamp(46px,14vw,72px);line-height:1;display:flex;align-items:center}
.picker.many{grid-template-columns:repeat(3,minmax(0,1fr));max-width:560px;gap:10px}
.picker.many .game-btn{padding:12px 4px;border-radius:24px}
.picker.many .game-btn .pic{height:clamp(46px,13vw,66px)}.picker.many .game-btn .pic .emo{font-size:clamp(38px,11vw,58px)}
.picker.many .game-btn .en{font-size:clamp(15px,4.3vw,22px)}
.bubbles{display:flex;gap:14px;justify-content:center;width:100%;max-width:560px}
.bub{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:8px;border:4px solid #fff;border-radius:999px;padding:14px 10px;cursor:pointer;
  font-family:var(--display);font-weight:700;font-size:clamp(24px,7vw,38px);color:#fff;text-shadow:0 2px 0 rgba(78,31,99,.3);box-shadow:0 6px 0 rgba(78,31,99,.25);transition:transform .2s}
.bubw{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:8px}
.bubw .bub{width:100%}
/* each answer has its own speaker: listen as many times as you like, then tap the answer */
.bub-say{flex:none;width:56px;height:56px;border-radius:50%;border:4px solid #fff;background:#fff;box-shadow:0 5px 0 rgba(78,31,99,.2);display:grid;place-items:center;padding:0;cursor:pointer}
.bub-say svg{width:32px;height:32px}
.bub-say:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(78,31,99,.2)}
.bub .q{font-size:1.2em}
.bub span{direction:ltr;text-align:center;line-height:1.05;overflow-wrap:break-word}
.bub span.long{font-size:.72em}
@media (max-width:440px){.bub{padding:12px 8px}.bub-say{width:48px;height:48px}.bub-say svg{width:28px;height:28px}.bubbles{gap:10px}}
.bubw:nth-child(1) .bub{background:linear-gradient(180deg,#ff8fc0,#e0307f)}
.bubw:nth-child(2) .bub{background:linear-gradient(180deg,#8fb0ff,#4a6fe0)}
.bub.on{transform:scale(1.1);box-shadow:0 0 0 6px var(--gold),0 6px 0 rgba(78,31,99,.25)}
.bub.right{background:linear-gradient(180deg,#7fe3c4,#29b98d);animation:pop .6s}
.bub.wrong{animation:shake .45s;opacity:.55}
.mic{width:clamp(110px,30vw,150px);aspect-ratio:1;border-radius:50%;border:6px solid #fff;cursor:pointer;display:grid;place-items:center;padding:0;
  background:linear-gradient(180deg,#ff8fc0,var(--rose-deep));box-shadow:0 8px 0 #b81f63}
.mic svg{width:52%;height:52%}
.mic:active{transform:translateY(4px);box-shadow:0 3px 0 #b81f63}
.mic.listen{animation:listen 1s ease-in-out infinite}
@keyframes listen{50%{box-shadow:0 0 0 18px rgba(255,79,154,.35),0 8px 0 #b81f63;transform:scale(1.06)}}
.mic.done{background:linear-gradient(180deg,#7fe3c4,#29b98d);box-shadow:0 8px 0 #1f8f6c}
.heard{min-height:1.4em;font-size:20px;color:var(--plum);direction:ltr;text-align:center}
.say-note{font-size:14px;color:#7a4a8c;text-align:center;max-width:34ch;line-height:1.45}
.doit .visual .emoji,.doit .visual .art{animation:doit .9s ease-in-out infinite}
@keyframes doit{50%{transform:translateY(-16px) scale(1.06)}}
html[data-kid="yam"] .mic{background:linear-gradient(180deg,#7fa0ff,#3f6fd8);box-shadow:0 8px 0 #24358f}
html[data-kid="yam"] .ltr{color:#24358f}
@media (max-height:700px){ .bub{padding:10px 8px} .mic{width:clamp(96px,24vh,130px)} .lcard .ltr{font-size:min(19vh,110px)} }
@media (min-width:700px) and (min-height:700px){ .bub{font-size:44px;padding:18px 14px} .bubbles{max-width:760px} .picker.many{max-width:760px;gap:18px} .lcard .ltr{font-size:min(26vh,220px)} }
@media (prefers-reduced-motion:reduce){*{animation:none!important}.balloon{top:var(--rt)!important}.air.calm .balloon{top:14%!important}.mcard .in{transition:none}}
/* ---------- Numbers app: counting pictures, dice, ten-frames, rods, number line ---------- */
.num{font-family:var(--display);font-weight:700;color:var(--rose-deep);line-height:1;direction:ltr;white-space:nowrap}
.word-en.expr{font-size:clamp(36px,11vw,60px)}
.opt .num{font-size:50cqw}
.opt.wide{aspect-ratio:auto}
.mcard .face .num{font-size:46cqw}
.balloon .face .num{font-size:44cqw}
.lvl .num{font-size:26cqw}
.cat .pic .num{font-size:clamp(24px,7vw,40px);color:#fff;text-shadow:0 3px 0 rgba(78,31,99,.35)}
.chip-pic .num{font-size:14px}
.cat .en{font-family:var(--body)}
.game-btn .en,.picker-title,.party h2,.hello h1,.cat-chip{font-family:var(--display)}
/* a box that its pictures size themselves to */
.box{container-type:size;width:100%;height:100%;display:grid;place-items:center;min-height:0}
.card .visual{container-type:normal}
.opt .box,.mcard .face .box{width:88%;height:88%}
/* n pictures to count */
.objs{display:grid;grid-template-columns:repeat(var(--c),1fr);gap:3cqw;width:min(100cqw,calc(100cqh*var(--c)/var(--r)*1.05));justify-items:center;align-items:center;direction:ltr}
.objs .o{width:100%;aspect-ratio:1;display:grid;place-items:center;position:relative;transition:transform .2s,opacity .3s}
.objs .o .art{width:100%;height:100%}
.objs .o.b{filter:drop-shadow(0 0 4px #ffbf2e) drop-shadow(0 0 2px #ffbf2e)}
.objs .o.gone{opacity:.28;transform:scale(.85)}

const MINUS='−';
const opTxt=o=>o==='-'?MINUS:'+';
let objTurn=0; const nextObj=()=>OBJ[objTurn++%OBJ.length];
/* Each card: ans (the number to find), label (shown on the learn card), q (the question picture, never showing the answer) */
function makeItem(cat,spec,i){
  const it={cat,kind:cat.kind,key:String(spec)};
  switch(cat.kind){
    case 'count': case 'digit': { const n=spec; it.ans=n; it.obj=nextObj(); it.label=String(n); it.he=numHe(n);
      it.done=cat.kind==='count'?P(W.here,n,W.x):P(W.num,n);
      it.ask=cat.kind==='count'?[L.howMany]:[L.tapNum,numHe(n)]; it.hear=cat.kind==='digit'; break }
    case 'dice': { const n=spec; it.ans=n; it.label=String(n); it.he=numHe(n); it.done=P(W.die,n,W.x); it.ask=[L.dots]; break }
    case 'num20': { const n=spec; it.ans=n; it.label=String(n); it.he=numHe(n); it.done=P(W.num,n); it.more=P(10,W.plus,n-10,W.is,n); it.ask=[L.tapNum,numHe(n)]; it.hear=true; break }
    case 'compare': { const [a,b,m,dig]=spec; it.a=a; it.b=b; it.mode=m; it.dig=!!dig; it.key=a+(m==='more'||m==='big'?'>':'<')+b+'?';
      const pick=(m==='more'||m==='big')?Math.max(a,b):Math.min(a,b); it.ans=pick===a?0:1; it.obj=nextObj();
      it.ask=[{more:L.more,less:L.less,big:L.big,small:L.small}[m]];
      it.done=dig?P(pick,W[m==='big'?'bigger':'smaller']):P(W.here,a,W.comma,W.there,b,W.dot);
      it.done2=dig?null:P(W[m]);
      it.label=''; break }
    case 'next': { const [s,k,step]=spec, st=step||1; it.seq=[0,1,2,3].map(j=>s+j*st); it.k=k; it.ans=it.seq[k]; it.step=st;
      it.key=it.seq.map((x,j)=>j===k?'?':x).join(','); it.ask=[L.missing]; it.qt=it.key.replace(/,/g,', '); break }
    case 'add': { const m=/^(\d+)([+-])(\d+)$/.exec(spec), a=+m[1], o=m[2], b=+m[3]; it.a=a; it.b=b; it.op=o; it.ans=o==='+'?a+b:a-b; it.obj=nextObj();
      it.qt=a+' '+opTxt(o)+' '+b+' = ?'; it.label=a+' '+opTxt(o)+' '+b+' = '+it.ans; it.key=a+opTxt(o)+b;
      it.done=P(a,W[o==='+'?'plus':'minus'],b,W.is,it.ans); it.ask=[P(a,W[o==='+'?'plus':'minus'],b,W.comma),L.howMuch]; break }
    case 'ten': { const a=spec; it.a=a; it.ans=10-a; it.qt=a+' + ? = 10'; it.label=a+' + '+(10-a)+' = 10'; it.key=a+'+?=10';
      it.done=P(a,W.plus,10-a,W.is,10); it.ask=[L.toTen]; break }

/* Topic: a short path of levels, a crown at the end */
function showTopic(cat,announce){
  screenId++; homeTo=null; navD=2;
  lastCat=cat.id; try{ localStorage.setItem(KEY+'last',cat.id) }catch(e){}
  $home.hidden=false;
  const lv=levelsOf(cat);
  const now=lv.findIndex((_,l)=>!isDone(cat,l));
  $main.innerHTML=`<div class="screen">
    <div class="cat-chip"><span class="chip-pic">${tileVisual(cat)}</span><span>${cat.he}</span></div>
    <div class="path">${lv.map((items,l)=>{
      const cls=isDone(cat,l)?'done':isOpen(cat,l)?'now':'locked';
      const badge=cls==='done'?art(UI.star):cls==='locked'?art(UI.lock):'';
      return `${l?'<span class="link"></span>':''}<button class="lvl ${cls}" data-l="${l}" aria-label="שלב ${l+1}">${levelPic(items)}${badge?`<span class="badge">${badge}</span>`:''}</button>` }).join('')}
      <span class="link"></span><span class="lvl-crown ${catDone(cat)?'won':''}">${art(ICON.crown())}</span></div>
    ${now!==0?`<button class="wand" id="review">${art(UI.wand,'ico')} <span>משחקים</span></button>`:''}
  </div>`;
  if(announce) say(he(cat.he).concat(catDone(cat)?he(L.crownHere):[]));
  $main.querySelectorAll('.lvl').forEach(b=>b.onclick=()=>{
    const l=+b.dataset.l;
    if(!isOpen(cat,l)){ boop(); const cur=$main.querySelector('.lvl.now'); if(cur) burstAt(cur,20); say(he(L.first)); return }
    tick(); burstAt(b,24); learn(cat,l,0);
  });
  const rv=document.getElementById('review'); if(rv) rv.onclick=()=>{ tick(); pickGame(cat,-1) };
  if(now<0&&!announce) say(he(L.allDone));
}
// what a level button shows: its first card's number or sum
function levelPic(items){ const it=items[0];
  if(it.kind==='compare') return numHTML(it.dig?'<>':'⚖️');
  if(it.kind==='add') return numHTML(it.a+opTxt(it.op)+it.b);
  if(it.kind==='next') return numHTML(it.seq[0]+'…');
  if(it.kind==='story') return numHTML('📖');
  return numHTML(items.map(x=>x.ans).slice(0,1)+(items.length>1?'…':'')) }

/* Learn cards: the solved picture, the number, and the voice explaining it (counting one by one where there is something to count) */
function learn(cat,level,i){
  screenId++; homeTo=()=>showTopic(cat); navD=3;
  $home.hidden=false;
  const items=levelsOf(cat)[level];
  const it=items[i], last=i===items.length-1;
  $main.innerHTML=`<div class="screen">
    <div class="card enter" id="card" role="button" aria-label="${G('שמעי שוב')}">
      <div class="speaker">${SPEAKER}</div>
      <div class="visual">${visual(it,true)}</div>
      ${it.kind==='story'?`<div class="story">${HE_SAY_M[G(it.text)]&&BOY?HE_SAY_M[G(it.text)]:HE_SAY[it.text]}</div>`:''}
      ${it.label?`<div class="word-en${it.label.length>4?' expr':''}">${it.label}</div>`:''}
      ${it.he?`<div class="word-he">${it.he}</div>`:''}
    </div>
    <div class="progress">${items.map((_,k)=>`<span class="dot${k<=i?' on':''}"></span>`).join('')}</div>
    <div class="nav">
      <button class="arrow" id="prev" aria-label="הקודם" ${i===0?'disabled':''}>${CHEV_R}</button>
      ${last?`<button class="wand" id="next">${art(UI.wand,'ico')} <span>משחקים</span></button>`:`<button class="arrow next" id="next" aria-label="הבא">${CHEV_L}</button>`}
    </div>
  </div>`;
  const card=document.getElementById('card');
  explain(it,card);
  card.onclick=()=>{ burstAt(card,18); explain(it,card) };
  document.getElementById('prev').onclick=()=>{ tick(); learn(cat,level,i-1) };
  document.getElementById('next').onclick=()=>{ tick(); last?pickGame(cat,level):learn(cat,level,i+1) };
}
// say a learn card; counting cards light up each thing as it is counted
let explainRun=0;
async function explain(it,card){
  const run=++explainRun, sid=screenId, still=()=>run===explainRun&&sid===screenId;
  const countUp=async(sel,from)=>{ const els=[...card.querySelectorAll(sel)]; els.forEach(e=>e.classList.remove('lit'));
    for(let k=0;k<els.length;k++){ if(!still()) return false; els[k].classList.add('lit'); blip(k); await say(he(numHe((from||0)+k+1))); }
    return still() };
  switch(it.kind){
    case 'count': if(await countUp('.o')) say(he(it.done)); break;
    case 'digit': say(he(it.done)); break;
    case 'dice': if(await countUp('.die i')) say(he(it.done)); break;
    case 'num20': say(he(it.done,it.more)); break;
    case 'compare': card.querySelectorAll('.side').forEach(s=>s.classList.remove('win')); await say(he(it.done));
      if(still()){ card.querySelectorAll('.side')[it.ans].classList.add('win'); if(it.done2) say(he(it.done2)) } break;
    case 'next': { const els=[...card.querySelectorAll('.nl b')];
      for(let k=0;k<els.length;k++){ if(!still()) return; els.forEach(e=>e.classList.remove('lit')); els[k].classList.add('lit'); blip(k); await say(he(numHe(it.seq[k]))) } break }
    case 'add': case 'ten': say(he(it.done)); break;
    case 'tens': say(he(it.done,it.more)); break;
    case 'story': await say(he(it.text)); if(still()) say(he(it.done)); break;
  }
}

/* ---------- Game context: this level's cards, or everything learned so far; weak ones come up more ---------- */
function makeCtx(cat,level){ const lv=levelsOf(cat); return {cat,level,pool:level<0?lv.filter((_,l)=>isDone(cat,l)).flat():lv[level]} }
function pickTargets(g,n){
  const out=[]; let bag=[];
  for(let k=0;k<n;k++){
    if(!bag.length) bag=g.pool.slice();
    const cand=bag.filter(x=>x!==out[out.length-1]); const from=cand.length?cand:bag;
    const w=from.map(x=>1+weakOf(g.cat,x)*2), tot=w.reduce((a,b)=>a+b,0);
    let r=Math.random()*tot, pick=from[from.length-1];
    for(let j=0;j<from.length;j++){ r-=w[j]; if(r<=0){ pick=from[j]; break } }
    out.push(pick); bag.splice(bag.indexOf(pick),1);
  }
  return out;
}
// wrong answers close to the right one (for tens: one ten away, or the digits swapped)
function nearNums(it,n){
  const a=it.ans, set=new Set();
  const cand=it.kind==='tens'?[a-10,a+10,a%10?(a%10)*10+Math.floor(a/10):a+1,a+1,a-1]:it.step===10?[a-10,a+10,a+1,a-1]:shuffle([a-1,a+1,a-2,a+2,a+3,a-3]);
  const max=Math.max(it.cat.max+2,10);
  for(const x of cand){ if(set.size===n) break; if(x!==a&&x>=(it.kind==='count'||it.kind==='dice'?1:0)&&x<=Math.max(max,a+1)&&!set.has(x)) set.add(x) }
  for(let d=1;set.size<n;d++){ if(a+d!==a&&!set.has(a+d)) set.add(a+d); if(set.size<n&&a-d>=0&&!set.has(a-d)) set.add(a-d) }
  return [...set].slice(0,n);
}

/* ---------- Shared game bits ---------- */
function win(el,it,next,extra){
  chime(); burstAt(el,46); react('happy'); addStar();
  const cheer=CHEER[Math.floor(Math.random()*CHEER.length)];
  const lines=(extra||he(it.kind==='compare'?it.done2||it.done:P(it.ans,W.x))).concat(he(cheer));
  if(next) sayThen(lines,next,600); else say(lines);
}
const askBtn=(label,cls)=>`<button class="ask" id="ask">${SPEAKER}<span class="q ${cls||''}">${label}</span></button>`;
const roundBar=r=>`<div class="round" aria-label="סיבוב ${r+1}">${starRow(r,ROUNDS)}</div>`;
// wrong answer: say what was picked, and after the second miss show the right one
function miss(g,target,chosen,wrongs,showHint){
  boop(); react('oops');
  if(wrongs===1) missed(g.cat,target);
  const named=chosen===null?[]:he(P(W.is,chosen));
  if(wrongs>=2){ showHint(); say(chosen===null?[]:named.concat(he(L.here,numHe(target.ans)))) }
  else say(named.concat(he(L.again)));
}
const KINDS_BAL=['count','digit','dice','num20','next','add','ten','tens','story'];
const KINDS_MEM=['count','digit','dice','num20','add'];
const KINDS_FEED=['count','digit','dice'];
function pickGame(cat,level){
  if(breakDue()) return showBreak(()=>pickGame(cat,level),3,()=>showTopic(cat));
  screenId++; homeTo=()=>showTopic(cat); navD=3;
  $home.hidden=false;
  const g=()=>makeCtx(cat,level);
  const games=[{he:'מוצאים',pic:UI.find,g:GRADS[4],run:()=>startFind(g())}];
  if(KINDS_BAL.includes(cat.kind)) games.push({he:'בלונים',pic:UI.balloons,g:GRADS[0],run:()=>startBalloons(g())});
  if(KINDS_MEM.includes(cat.kind)) games.push({he:'זיכרון',pic:UI.memory,g:GRADS[1],run:()=>startMemory(g())});
  if(KINDS_FEED.includes(cat.kind)) games.push({he:BOY?'מאכילים את הדרקון':'מאכילים את החד־קרן',pic:PIC.Cookie.img,g:GRADS[2],run:()=>startFeed(g())});
  $main.innerHTML=`<div class="screen">
    <div class="cat-chip"><span class="chip-pic">${tileVisual(cat)}</span><span>${cat.he}</span></div>
    <div class="picker-title">${G(L.play)}</div>
    <div class="picker">${games.map((x,k)=>`<button class="game-btn" data-k="${k}" style="background:linear-gradient(160deg,${x.g})"><span class="pic">${art(x.pic)}</span><span class="en">${x.he}</span></button>`).join('')}</div>
    ${level<0?'':`<button class="wand" id="cards">${art(ICON.book(),'ico')} <span>כרטיסים</span></button>`}
  </div>`;
  say(he(L.pick));
  $main.querySelectorAll('.game-btn').forEach(b=>b.onclick=()=>{ tick(); burstAt(b,24); games[+b.dataset.k].run() });
  if(level>=0) document.getElementById('cards').onclick=()=>{ tick(); learn(cat,level,0) };
}
// what the question pill shows: never the answer
function askLabel(it){
  if(it.qt) return [it.qt,''];
  if(it.kind==='compare') return [G(it.ask[0]),'he'];
  return ['?',''];
}

/* ---------- Game 1: Find it (the question, three answers) ---------- */
function startFind(g){ screenId++; findRound(g,pickTargets(g,ROUNDS),0) }
function findRound(g,targets,r){
  screenId++; homeTo=()=>pickGame(g.cat,g.level); navD=4;
  $home.hidden=false;
  const target=targets[r], cmp=target.kind==='compare';
  const opts=cmp?[0,1]:shuffle([target.ans,...nearNums(target,2)]);
  const [lab,lc]=askLabel(target);
  const showQ=!target.hear&&!cmp;
  $main.innerHTML=`<div class="screen${target.kind==='story'?' whats':''}">
    ${roundBar(r)}
    ${showQ?`<div class="card enter" id="card" role="button" aria-label="${G('שמעי שוב')}"><div class="speaker">${SPEAKER}</div><div class="visual">${visual(target)}</div>${target.kind==='story'?`<div class="story">${BOY&&HE_SAY_M[G(target.text)]||HE_SAY[target.text]}</div>`:''}</div>`:askBtn(lab,lc)}
    <div class="options${cmp?' two':''}">${opts.map((o,k)=>`<button class="opt" data-k="${k}" aria-label="${cmp?'צד '+(k+1):o}">${cmp?'':numHTML(o)}</button>`).join('')}</div>
  </div>`;
  if(cmp){ const parts=[...$main.querySelectorAll('.opt')]; const sides=[target.a,target.b];
    parts.forEach((b,k)=>{ b.innerHTML=`<div class="box">${target.dig?`<span class="num" style="font-size:min(60cqh,45cqw)">${sides[k]}</span>`:objsHTML(sides[k],target.obj)}</div>` }) }
  const ask=()=>say(he(...target.ask.map(G)));
  ask();
  const q=document.getElementById('card')||document.getElementById('ask'); q.onclick=()=>{ burstAt(q,12); ask() };
  let done=false, wrongs=0;
  const btns=[...$main.querySelectorAll('.opt')];
  const right=cmp?target.ans:target.ans;
  btns.forEach(b=>b.onclick=()=>{
    if(done) return;
    const o=opts[+b.dataset.k];
    if(o===right){
      done=true; b.classList.remove('hint'); b.classList.add('right');
      if(!wrongs) gotIt(g.cat,target);
      win(b,target,()=>r+1<ROUNDS?findRound(g,targets,r+1):party(g,()=>startFind(g)));
    } else {
      wrongs++; b.classList.remove('wrong'); void b.offsetWidth; b.classList.add('wrong');
      miss(g,target,cmp?null:o,wrongs,()=>btns[opts.indexOf(right)].classList.add('hint'));
      if(cmp&&wrongs<2) say(he(L.again));
    }
  });
}

/* ---------- Game 2: Balloons (pop the balloon with the answer) ---------- */
const BALLOON_COLORS=[['#ff4f9a','#ff9ac9'],['#9566f2','#c6a4ff'],['#ffbf2e','#ffe08a'],['#29b98d','#7fe3c4'],['#5b8dff','#9cc0ff']];
// number cards ask "pop the balloon of seven"; sums and stories ask their own question
const popAsk=it=>['count','digit','dice','num20','tens'].includes(it.kind)?he(L.popOf,numHe(it.ans)):he(...it.ask.map(G));
function startBalloons(g){ screenId++; const t=pickTargets(g,ROUNDS); sayThen(he(L.pop),()=>balloonRound(g,t,0),300) }
function balloonRound(g,targets,r){
  screenId++; homeTo=()=>pickGame(g.cat,g.level); navD=4;
  $home.hidden=false;
  const target=targets[r];
  const nb=($main.clientWidth<520)?3:4;
  const items=shuffle([target.ans,...nearNums(target,nb-1)]);
  const lanes=shuffle(nb===3?[3,36,69]:[2,26,50,74]);
  const cols=shuffle(BALLOON_COLORS);
  const others=shuffle([.02,.5,.7]);
  const lab=['count','digit','dice','num20','tens'].includes(target.kind)?'?':askLabel(target)[0];
  $main.innerHTML=`<div class="screen fill">
    ${roundBar(r)}
    ${askBtn(lab)}
    <div class="air" id="air" style="--bw:${nb===3?'28%':'24%'}">${items.map((n,k)=>{
      const d=14+Math.random()*3, f=n===target.ans?.2:others.pop(), delay=-(d*f);
      return `<button class="balloon" data-k="${k}" aria-label="${n}" style="left:${lanes[k]}%;--d:${d.toFixed(1)}s;--delay:${delay.toFixed(1)}s;--b:${cols[k][0]};--b2:${cols[k][1]};--rt:${20+(k%2)*30}%"><span class="skin"><span class="face">${numHTML(n)}</span></span></button>` }).join('')}</div>
  </div>`;
  const ask=()=>say(popAsk(target));
  ask();
  document.getElementById('ask').onclick=ask;
  let done=false, wrongs=0;
  const air=document.getElementById('air');
  const calm=()=>air.classList.toggle('calm',air.clientHeight<300);
  calm(); requestAnimationFrame(calm);
  const btns=[...$main.querySelectorAll('.balloon')];
  btns.forEach(b=>b.onclick=()=>{
    if(done) return;
    const n=items[+b.dataset.k];
    if(n===target.ans){
      done=true;
      if(!air.classList.contains('calm')) b.style.top=getComputedStyle(b).top; b.classList.remove('hint'); b.classList.add('popped');
      tone(180,0,.12,'square',.12);
      if(!wrongs) gotIt(g.cat,target);
      win(b,target,()=>r+1<ROUNDS?balloonRound(g,targets,r+1):party(g,()=>startBalloons(g)));
    } else {
      wrongs++; b.classList.remove('wrong'); void b.offsetWidth; b.classList.add('wrong');
      miss(g,target,n,wrongs,()=>{
        const t=btns[items.indexOf(target.ans)], A=air.getBoundingClientRect(), R=t.getBoundingClientRect();
        let top=R.top-A.top; if(top<10||top>A.height-R.height-10) top=(A.height-R.height)/2;
        if(!air.classList.contains('calm')) t.style.top=top+'px'; t.classList.add('hint');
      });
    }
  });
}

/* ---------- Game 3: Memory (a picture and its number make a pair) ---------- */
function startMemory(g){
  screenId++; homeTo=()=>pickGame(g.cat,g.level); navD=4;
  $home.hidden=false;
  const picks=[];
  for(const t of pickTargets(g,12).concat(shuffle(g.pool),shuffle(g.cat.items))){ if(picks.length===3) break; if(!picks.some(p=>p.ans===t.ans)) picks.push(t) }
  const deck=shuffle(picks.flatMap(it=>[{it,face:small(it)},{it,face:numHTML(it.ans)}]));
  $main.innerHTML=`<div class="screen">
    <div class="picker-title">${G(L.pairs)}</div>
    <div class="mem">${deck.map((c,k)=>`<button class="mcard" data-k="${k}" data-p="${picks.indexOf(c.it)}" aria-label="קלף"><span class="in"><span class="back">${art(ICON.crown())}</span><span class="face">${c.face}</span></span></button>`).join('')}</div>
  </div>`;
  say(he(L.pairs));
  let first=null, busy=false, found=0, misses=0;
  const cards=[...$main.querySelectorAll('.mcard')];
  cards.forEach(b=>b.onclick=()=>{
    if(busy||b.classList.contains('open')||b.classList.contains('done')) return;
    const c=deck[+b.dataset.k];
    b.classList.add('open'); tick();
    if(!first){
      first=b;
      if(misses>=3){ const mate=cards.find(x=>x!==b&&deck[+x.dataset.k].it===c.it); mate.classList.add('hint') }
      return;
    }
    const a=first; first=null;
    cards.forEach(x=>x.classList.remove('hint'));
    if(deck[+a.dataset.k].it===c.it){
      a.classList.add('done'); b.classList.add('done'); a.classList.remove('open'); b.classList.remove('open');
      found++; misses=0; busy=true;
      const allDone=found===picks.length;
      win(b,c.it,allDone?()=>party(g,()=>startMemory(g)):()=>{ busy=false },he(c.it.kind==='add'?c.it.done:P(c.it.ans,W.x)));
    } else {
      misses++; busy=true;
      later(()=>{ a.classList.remove('open'); b.classList.remove('open'); busy=false },1300);
    }
  });
}

/* ---------- Game 4: Feed the unicorn / the dragon (give exactly as many cookies as asked) ---------- */
function startFeed(g){ screenId++; const t=pickTargets(g,ROUNDS); feedRound(g,t,0) }
function feedRound(g,targets,r){
  const id=++screenId; homeTo=()=>pickGame(g.cat,g.level); navD=4;
  $home.hidden=false;
  const target=targets[r], n=target.ans;
  $main.innerHTML=`<div class="screen">
    ${roundBar(r)}
    ${askBtn(String(n))}
    <div class="feed"><div class="pet" id="pet">${BOY?'🐉':art(PIC.Unicorn.img)}</div><div class="plate" id="plate"></div></div>
    <div class="feed-btns"><button class="undo" id="undo" aria-label="להחזיר עוגייה">↩️</button>
      <button class="jar" id="jar" aria-label="עוגייה">${art(PIC.Cookie.img)}</button>
      <button class="wand" id="fdone">${art(UI.star,'ico')} <span>${G(line('סיימתי','סִיַּמְתִּי'))}</span></button></div>
  </div>`;
  const ask=()=>say(he(G(L.feed),cookies(n)));
  ask();
  document.getElementById('ask').onclick=ask;
  let k=0, done=false, wrongs=0;
  const plate=document.getElementById('plate'), jar=document.getElementById('jar');
  const draw=()=>{ plate.innerHTML=Array.from({length:k},()=>art(PIC.Cookie.img)).join('') };
  jar.onclick=()=>{ if(done||k>=12) return; k++; draw(); blip(k); say(he(numHe(k))) };
  document.getElementById('undo').onclick=()=>{ if(done||!k) return; k--; draw(); tick(); if(k) say(he(numHe(k))) };
  document.getElementById('fdone').onclick=()=>{
    if(done) return;
    if(k===n){ done=true; const pet=document.getElementById('pet'); pet.classList.add('yum'); tone(520,0,.1); tone(780,.1,.15);
      if(!wrongs) gotIt(g.cat,target);
      win(pet,target,()=>r+1<ROUNDS?feedRound(g,targets,r+1):party(g,()=>startFeed(g)),he(P(W.here,n,W.x)));
    } else {
      wrongs++; boop(); react('oops'); if(wrongs===1) missed(g.cat,target);
      say(he(P(W.here,k,W.comma),P(W.need,n,W.dot),L.again));
    }
  };
}

/* ---------- End of a game: level done, maybe a crown ---------- */
function party(g,again){
  screenId++; homeTo=()=>showTopic(g.cat); navD=3;
  $home.hidden=false;
  const lv=levelsOf(g.cat);
  const review=g.level<0;
  const firstTime=!review&&!isDone(g.cat,g.level);
  const crowned=!review&&markDone(g.cat,g.level);
  const opened=firstTime&&g.level+1<lv.length;
  const got=newStickers.splice(0);
  $main.innerHTML=`<div class="screen party">
    ${charHTML('big',crowned?'won':'')}
    <h2>${crowned?'קיבלת כתר!':G(L.great)}</h2>

// Every screen except the scrolling ones must fit without scrolling: if it is taller than the space, shrink it to fit
function fitScreen(){
  const scr=$main.querySelector('.screen'); if(!scr) return;
  scr.style.zoom='';
  if(scr.classList.contains('scrolls')) return;
  const cs=getComputedStyle($main), avail=$main.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  const need=scr.offsetHeight;
  if(need>avail+1) scr.style.zoom=String(Math.max(.45,(avail-2)/need));
}
function markScroll(){ $main.classList.toggle('scrollable',$main.scrollHeight-$main.clientHeight>4&&$main.scrollTop+$main.clientHeight<$main.scrollHeight-4) }

function hush(){ talkId++; explainRun++; lastSay=null; try{ synth&&synth.cancel() }catch(e){} document.documentElement.classList.remove('talking'); stopMouth() }
/* The phone's Back button steps back inside the app, like the home button.
   History holds one entry per step away from the start screen (start 0, topics 1, a topic 2, learning or game picker 3, a game 4).
   Entries are added only right after a tap: Chrome's Back button skips entries pushed without a tap, and would then leave the app
   (same scheme as apps/melody-english). A tap goes at most one step deeper (the album and the parent corner sit one step below
   where they were opened), since Chrome also skips an entry when one tap pushes two */
if(history.state&&history.state.lumda) try{ history.replaceState(null,'') }catch(e){}
const navDepth=()=>atStart?0:navD;   // every screen sets navD
const histDepth=()=>(history.state&&history.state.d)||0;
let syncTo=null;   // the depth a history.go() of ours is heading to
const syncDown=()=>{ if(syncTo!==null) return; const want=navDepth(), have=histDepth();
  if(want<have) try{ syncTo=want; history.go(want-have) }catch(e){ syncTo=null } };
const guard=()=>{ if(syncTo!==null) return; const want=navDepth(), have=histDepth();
  try{ if(want>have) for(let k=have+1;k<=want;k++) history.pushState({lumda:1,d:k},''); else syncDown() }catch(e){} };
const stepBack=()=>{ if($main.querySelector('.cats')) return showStart(); const go=homeTo; go?go():showCats() };
addEventListener('popstate',()=>{
  if(syncTo!==null){ const t=syncTo; syncTo=null; if(histDepth()===t) return }
  if(atStart) return;
  tick();
  const d=histDepth(); let n=0;
  while(navDepth()>d&&n++<6) stepBack();
});
addEventListener('click',guard);     // bubbles up after the button's own handler has changed the screen
addEventListener('pointerup',guard); // the parent corner opens while the title is held
new MutationObserver(()=>{ if(talkScreen!==screenId) hush(); syncDown(); $buddyBar.hidden=!!$main.querySelector('.pm.big'); $main.scrollTop=keepTop||0; keepTop=null; fitScreen(); requestAnimationFrame(()=>{ fitScreen(); markScroll() }) }).observe($main,{childList:true});
addEventListener('resize',()=>requestAnimationFrame(()=>{ fitScreen(); markScroll() }));
addEventListener('load',fitScreen);
$main.addEventListener('load',()=>requestAnimationFrame(fitScreen),true);   // a picture that arrives late can make the screen taller
$buddy.onclick=()=>{ react('happy'); burstAt($buddy,16); if(lastSay) say(lastSay) };
showStart();
document.documentElement.classList.add('ready');
</script>
